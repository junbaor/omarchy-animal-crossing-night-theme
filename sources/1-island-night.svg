<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141E29"/>
      <stop offset="0.55" stop-color="#1E3242"/>
      <stop offset="1" stop-color="#2A4454"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274453"/>
      <stop offset="1" stop-color="#182A36"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4EBC8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4EBC8" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
      <ellipse cx="0" cy="6" rx="92" ry="40"/>
      <ellipse cx="72" cy="-8" rx="66" ry="32"/>
      <ellipse cx="-74" cy="-4" rx="58" ry="28"/>
      <ellipse cx="12" cy="-26" rx="52" ry="26"/>
    </g>
    <g id="star4">
      <path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
    </g>
    <g id="firefly">
      <circle r="16" opacity="0.22"/>
      <circle r="7" opacity="0.55"/>
      <circle r="3.2"/>
    </g>
    <g id="palm">
      <path d="M-7 0 C -16 -78 -8 -158 7 -232 L 27 -227 C 14 -156 9 -78 13 0 Z" fill="#16281F"/>
      <circle cx="-6" cy="-224" r="13" fill="#16281F"/>
      <circle cx="20" cy="-216" r="11" fill="#16281F"/>
      <g transform="translate(10,-232)">
        <g fill="#1C3226">
          <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-150)"/>
          <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-105)"/>
          <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-60)"/>
          <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-18)"/>
          <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(28)"/>
        </g>
        <g fill="#24402F">
          <path d="M0 0 C 40 -32 98 -36 142 -12 C 100 -2 50 12 6 14 Z" transform="rotate(-128)"/>
          <path d="M0 0 C 40 -32 98 -36 142 -12 C 100 -2 50 12 6 14 Z" transform="rotate(-84)"/>
          <path d="M0 0 C 40 -32 98 -36 142 -12 C 100 -2 50 12 6 14 Z" transform="rotate(-40)"/>
          <path d="M0 0 C 40 -32 98 -36 142 -12 C 100 -2 50 12 6 14 Z" transform="rotate(6)"/>
          <path d="M0 0 C 40 -32 98 -36 142 -12 C 100 -2 50 12 6 14 Z" transform="rotate(52)"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- sky -->
  <rect width="2560" height="840" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#EFE7CF">
    <circle cx="180" cy="120" r="2.6" opacity="0.9"/>
    <circle cx="420" cy="330" r="2" opacity="0.6"/>
    <circle cx="640" cy="90" r="2.2" opacity="0.8"/>
    <circle cx="820" cy="240" r="1.8" opacity="0.55"/>
    <circle cx="1010" cy="60" r="2.6" opacity="0.9"/>
    <circle cx="1210" cy="180" r="2" opacity="0.7"/>
    <circle cx="1420" cy="90" r="1.8" opacity="0.5"/>
    <circle cx="1560" cy="260" r="2.2" opacity="0.75"/>
    <circle cx="2400" cy="330" r="2" opacity="0.65"/>
    <circle cx="2260" cy="100" r="2.4" opacity="0.8"/>
    <circle cx="1900" cy="80" r="1.8" opacity="0.5"/>
    <circle cx="90" cy="480" r="1.8" opacity="0.45"/>
    <circle cx="1330" cy="420" r="1.8" opacity="0.4"/>
    <circle cx="2450" cy="520" r="1.8" opacity="0.4"/>
    <use xlink:href="#star4" transform="translate(560,180) scale(0.9)" opacity="0.9"/>
    <use xlink:href="#star4" transform="translate(1090,300) scale(0.7)" opacity="0.7"/>
    <use xlink:href="#star4" transform="translate(2150,200) scale(0.85)" opacity="0.85"/>
    <use xlink:href="#star4" transform="translate(300,560) scale(0.6)" opacity="0.55"/>
  </g>

  <!-- shooting star -->
  <g opacity="0.85">
    <path d="M600 110 L900 215" stroke="#F4EBC8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M680 137 L900 215" stroke="#F4EBC8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <circle cx="900" cy="215" r="7" fill="#F4EBC8"/>
  </g>

  <!-- moon -->
  <circle cx="2080" cy="300" r="330" fill="url(#moonGlow)"/>
  <circle cx="2080" cy="300" r="140" fill="#F2E7C4"/>
  <circle cx="2040" cy="260" r="26" fill="#E2D5AC" opacity="0.85"/>
  <circle cx="2118" cy="330" r="18" fill="#E2D5AC" opacity="0.8"/>
  <circle cx="2062" cy="352" r="12" fill="#E2D5AC" opacity="0.75"/>

  <!-- night clouds -->
  <g fill="#31495A" opacity="0.75">
    <use xlink:href="#cloud" transform="translate(390,205) scale(1.15)"/>
    <use xlink:href="#cloud" transform="translate(1120,130) scale(0.85)"/>
    <use xlink:href="#cloud" transform="translate(2440,150) scale(0.7)"/>
  </g>

  <!-- sea -->
  <rect y="830" width="2560" height="610" fill="url(#sea)"/>
  <rect y="830" width="2560" height="6" fill="#9FB6B0" opacity="0.35"/>

  <!-- moon reflection -->
  <g fill="#EFE3BC">
    <ellipse cx="2080" cy="900" rx="200" ry="18" opacity="0.4"/>
    <ellipse cx="2080" cy="960" rx="140" ry="15" opacity="0.3"/>
    <ellipse cx="2080" cy="1035" rx="100" ry="12" opacity="0.24"/>
    <ellipse cx="2080" cy="1120" rx="70" ry="10" opacity="0.18"/>
    <ellipse cx="2080" cy="1215" rx="46" ry="8" opacity="0.14"/>
  </g>

  <!-- waves -->
  <g stroke="#5E8496" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M330 930 q 34 -16 68 0"/>
    <path d="M900 980 q 40 -18 80 0"/>
    <path d="M1750 940 q 34 -16 68 0"/>
    <path d="M520 1120 q 44 -20 88 0"/>
    <path d="M1240 1150 q 44 -20 88 0"/>
    <path d="M760 1310 q 48 -22 96 0"/>
    <path d="M1600 1330 q 44 -20 88 0"/>
    <path d="M2380 1260 q 44 -20 88 0"/>
  </g>

  <!-- far island -->
  <ellipse cx="2020" cy="840" rx="190" ry="26" fill="#2C463C"/>
  <g transform="translate(2020,826) scale(0.42)">
    <path d="M-7 0 C -16 -78 -8 -158 7 -232 L 27 -227 C 14 -156 9 -78 13 0 Z" fill="#16281F"/>
    <g transform="translate(10,-232)" fill="#1C3226">
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-140)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-80)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-20)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(40)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(100)"/>
    </g>
  </g>

  <!-- sailboat with lantern -->
  <g transform="translate(1950,1115)">
    <path d="M-70 0 L70 0 L46 34 L-48 34 Z" fill="#1A242C"/>
    <path d="M0 -6 L0 -118" stroke="#131A21" stroke-width="7"/>
    <path d="M4 -118 L4 -18 L88 -18 Z" fill="#D8CBA4" opacity="0.9"/>
    <path d="M-4 -100 L-4 -18 L-58 -18 Z" fill="#B7AC8A" opacity="0.9"/>
    <circle cx="0" cy="-8" r="9" fill="#FFE9A0"/>
    <circle cx="0" cy="-8" r="20" fill="#FFE9A0" opacity="0.3"/>
  </g>

  <!-- main island -->
  <path d="M-60 1440 L-60 1010 C 260 918 560 936 820 992 C 1060 1042 1320 1024 1490 1090 C 1552 1118 1588 1210 1592 1320 L1592 1440 Z" fill="#5A5140"/>
  <path d="M-60 1440 L-60 946 C 270 846 570 866 830 926 C 1070 980 1320 962 1490 1030 C 1550 1058 1580 1150 1584 1260 L1584 1440 Z" fill="#33513F"/>
  <path d="M-60 1440 L-60 972 C 270 872 570 892 830 952 C 1070 1006 1320 988 1490 1056 C 1548 1084 1574 1170 1578 1276 L1578 1440 Z" fill="#2A4436"/>
  <path d="M-60 1440 L-60 1330 C 420 1284 940 1296 1520 1340 C 1556 1352 1578 1384 1578 1440 Z" fill="#20362A"/>

  <!-- palms -->
  <use xlink:href="#palm" transform="translate(340,935) scale(1.18)"/>
  <use xlink:href="#palm" transform="translate(590,958) scale(0.92)"/>

  <!-- grass tufts -->
  <g fill="#3E5A48">
    <path d="M420 1042 q -8 -26 2 -44 q 6 22 10 44 Z"/>
    <path d="M436 1042 q 4 -24 16 -36 q -2 20 -4 36 Z"/>
    <path d="M1150 1088 q -8 -26 2 -44 q 6 22 10 44 Z"/>
    <path d="M1166 1088 q 4 -24 16 -36 q -2 20 -4 36 Z"/>
  </g>

  <!-- fireflies over the island -->
  <g fill="#FFE9A0">
    <use xlink:href="#firefly" transform="translate(260,1000)"/>
    <use xlink:href="#firefly" transform="translate(470,1080) scale(0.8)"/>
    <use xlink:href="#firefly" transform="translate(700,1010) scale(1.1)"/>
    <use xlink:href="#firefly" transform="translate(920,1120) scale(0.7)"/>
    <use xlink:href="#firefly" transform="translate(1120,1060)"/>
    <use xlink:href="#firefly" transform="translate(1330,1150) scale(0.85)"/>
    <use xlink:href="#firefly" transform="translate(1520,1240) scale(0.7)"/>
  </g>

  <!-- islet bottom right -->
  <path d="M2120 1440 L2120 1400 C 2160 1330 2300 1296 2440 1310 C 2500 1318 2540 1340 2560 1364 L2560 1440 Z" fill="#5A5140"/>
  <path d="M2150 1440 L2150 1396 C 2190 1330 2310 1300 2440 1312 C 2500 1320 2540 1342 2560 1366 L2560 1440 Z" fill="#2A4436"/>
  <use xlink:href="#firefly" transform="translate(2380,1330) scale(0.9)" fill="#FFE9A0"/>
</svg>
