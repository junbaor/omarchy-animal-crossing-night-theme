<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <g id="leaf">
      <path d="M0 -58 C 34 -52 52 -22 44 12 C 36 42 4 58 -20 46 C -44 34 -50 4 -38 -22 C -30 -42 -16 -54 0 -58 Z"/>
      <path d="M-6 -46 C -2 -20 0 8 2 34" stroke="#1F2A33" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M-6 50 q -10 16 -24 22" stroke="#1F2A33" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <g id="bloom">
      <g>
        <ellipse cx="0" cy="-17" rx="10" ry="14"/>
        <ellipse cx="0" cy="-17" rx="10" ry="14" transform="rotate(72 0 -2)"/>
        <ellipse cx="0" cy="-17" rx="10" ry="14" transform="rotate(144 0 -2)"/>
        <ellipse cx="0" cy="-17" rx="10" ry="14" transform="rotate(216 0 -2)"/>
        <ellipse cx="0" cy="-17" rx="10" ry="14" transform="rotate(288 0 -2)"/>
      </g>
      <circle cx="0" cy="-2" r="9"/>
    </g>
    <g id="star4">
      <path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
    </g>
    <pattern id="meadow" width="560" height="560" patternUnits="userSpaceOnUse">
      <use xlink:href="#leaf" transform="translate(150,150) rotate(-18) scale(1.6)" fill="#2C4437" opacity="0.85"/>
      <use xlink:href="#leaf" transform="translate(430,105) rotate(26) scale(1.05)" fill="#31465A" opacity="0.8"/>
      <use xlink:href="#leaf" transform="translate(120,430) rotate(42) scale(1.15)" fill="#34506E" opacity="0.6"/>
      <use xlink:href="#leaf" transform="translate(445,425) rotate(-42) scale(1.35)" fill="#3A5242" opacity="0.7"/>
      <use xlink:href="#bloom" transform="translate(300,315) scale(1.25)" fill="#4A3B44" opacity="0.9"/>
      <use xlink:href="#bloom" transform="translate(50,270) scale(0.9) rotate(20)" fill="#4E4530" opacity="0.9"/>
      <use xlink:href="#bloom" transform="translate(520,265) scale(0.85)" fill="#41374A" opacity="0.85"/>
      <circle cx="240" cy="60" r="2.4" fill="#EFE7CF" opacity="0.5"/>
      <circle cx="500" cy="330" r="2" fill="#EFE7CF" opacity="0.4"/>
      <circle cx="60" cy="520" r="2.2" fill="#EFE7CF" opacity="0.45"/>
      <circle cx="330" cy="500" r="1.8" fill="#EFE7CF" opacity="0.35"/>
      <circle cx="560" cy="60" r="2" fill="#EFE7CF" opacity="0.4"/>
      <circle cx="180" cy="330" r="1.8" fill="#EFE7CF" opacity="0.3"/>
      <use xlink:href="#star4" transform="translate(360,60) scale(0.55)" fill="#EFE7CF" opacity="0.55"/>
      <use xlink:href="#star4" transform="translate(95,110) scale(0.45)" fill="#EFE7CF" opacity="0.45"/>
    </pattern>
    <g id="firefly">
      <circle r="16" opacity="0.18"/>
      <circle r="7" opacity="0.45"/>
      <circle r="3.2"/>
    </g>
  </defs>

  <rect width="2560" height="1440" fill="#1F2A33"/>
  <rect width="2560" height="1440" fill="url(#meadow)"/>

  <!-- a few wandering fireflies -->
  <g fill="#FFE9A0">
    <use xlink:href="#firefly" transform="translate(640,420)"/>
    <use xlink:href="#firefly" transform="translate(1420,980) scale(0.85)"/>
    <use xlink:href="#firefly" transform="translate(2100,340) scale(0.9)"/>
    <use xlink:href="#firefly" transform="translate(1780,1280) scale(0.75)"/>
    <use xlink:href="#firefly" transform="translate(320,1240) scale(0.9)"/>
  </g>
</svg>
